services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: usability_db
    environment:
      - ACCEPT_EULA=Y
      - "MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in the local environment or .env}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
